# Policy for `cargo deny check`; see docs/v1-plan.md#dependency-policy.

[licenses]
# Permissive licences compatible with GPL-3.0-or-later.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]

[licenses.private]
# Our own crates are `publish = false` and GPL-3.0-or-later.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
